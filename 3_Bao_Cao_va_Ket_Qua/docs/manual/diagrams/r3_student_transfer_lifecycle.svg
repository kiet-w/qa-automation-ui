<svg viewBox="0 0 1180 560" width="100%" height="auto" class="select-none font-sans" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="tr-sky" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38BDF8"/>
    </marker>
    <marker id="tr-emerald" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#10B981"/>
    </marker>
    <marker id="tr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#F59E0B"/>
    </marker>
    <marker id="tr-rose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#F43F5E"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0B101B"/>
  <text x="35" y="40" font-size="15" font-weight="700" fill="#F8FAFC">F07: STUDENT TRANSFER &amp; CLASS CHANGE LIFECYCLE STATE MACHINE</text>
  <text x="35" y="60" font-size="11" fill="#94A3B8" font-family="monospace">Comparing Within-School Class Change vs Cross-School Transfer Lifecycle &amp; Charge Integrity</text>
  <line x1="35" y1="72" x2="1145" y2="72" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="88" width="530" height="440" rx="12" fill="#121929" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="55" y="78" width="280" height="22" rx="4" fill="#0284C7"/>
  <text x="65" y="93" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="monospace">CASE 1: CHUYỂN LỚP TRONG CÙNG TRƯỜNG</text>
  <rect x="70" y="125" width="210" height="70" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="85" y="148" font-size="11" font-weight="700" fill="#F8FAFC">Class Assignment A</text>
  <text x="85" y="166" font-size="9.5" fill="#34D399">&bull; Status = Active</text>
  <text x="85" y="182" font-size="9.5" fill="#94A3B8">Enrolment Profile = Active</text>
  <rect x="70" y="245" width="210" height="70" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="85" y="268" font-size="11" font-weight="700" fill="#F8FAFC">Class Assignment A (Old)</text>
  <text x="85" y="286" font-size="9.5" fill="#F87171">&bull; Status = Ended</text>
  <text x="85" y="302" font-size="9.5" fill="#94A3B8">End Date = Change Date</text>
  <rect x="70" y="365" width="210" height="70" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="85" y="388" font-size="11" font-weight="700" fill="#F8FAFC">Class Assignment B (New)</text>
  <text x="85" y="406" font-size="9.5" fill="#34D399">&bull; Status = Active</text>
  <text x="85" y="422" font-size="9.5" fill="#94A3B8">New Class Code &amp; Academic Level</text>
  <rect x="315" y="185" width="235" height="190" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="330" y="210" font-size="11" font-weight="700" fill="#38BDF8">QUY TẮC TOÀN VẸN (CASE 1):</text>
  <text x="330" y="235" font-size="9.5" fill="#F8FAFC">&bull; Enrolment Profile: GIỮ NGUYÊN</text>
  <text x="330" y="255" font-size="9.5" fill="#94A3B8">  Không tạo enrolment mới vì</text>
  <text x="330" y="270" font-size="9.5" fill="#94A3B8">  học sinh vẫn thuộc cùng trường.</text>
  <text x="330" y="295" font-size="9.5" fill="#F8FAFC">&bull; Bút toán Phí đã phát hành:</text>
  <text x="330" y="315" font-size="9.5" fill="#34D399">  Các khoản thu POSTED giữ</text>
  <text x="330" y="330" font-size="9.5" fill="#34D399">  nguyên, không bị hủy tự động.</text>
  <text x="330" y="355" font-size="9.5" fill="#94A3B8">&bull; Thẩm quyền: School User</text>
  <path d="M 175 195 L 175 245" stroke="#F43F5E" stroke-width="1.8" marker-end="url(#tr-rose)"/>
  <path d="M 175 315 L 175 365" stroke="#10B981" stroke-width="1.8" marker-end="url(#tr-emerald)"/>
  <rect x="600" y="88" width="540" height="440" rx="12" fill="#121929" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="615" y="78" width="300" height="22" rx="4" fill="#B45309"/>
  <text x="625" y="93" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="monospace">CASE 2: CHUYỂN TRƯỜNG (CROSS-SCHOOL TRANSFER)</text>
  <rect x="630" y="125" width="230" height="85" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="645" y="148" font-size="11" font-weight="700" fill="#F8FAFC">Trường Cũ (Source School)</text>
  <text x="645" y="168" font-size="9.5" fill="#F87171">&bull; Enrolment Status = Transferred</text>
  <text x="645" y="186" font-size="9.5" fill="#F87171">&bull; Class Assignment = Ended</text>
  <text x="645" y="202" font-size="9.5" fill="#94A3B8">Audit: HQ Closed Enrolment</text>
  <rect x="630" y="350" width="230" height="85" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="645" y="373" font-size="11" font-weight="700" fill="#F8FAFC">Trường Đích (Target School)</text>
  <text x="645" y="393" font-size="9.5" fill="#34D399">&bull; Enrolment Status = Active (Mới)</text>
  <text x="645" y="411" font-size="9.5" fill="#34D399">&bull; Class Assignment = Active (Mới)</text>
  <text x="645" y="427" font-size="9.5" fill="#94A3B8">Audit: HQ Created New Enrolment</text>
  <rect x="885" y="160" width="235" height="235" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="900" y="185" font-size="11" font-weight="700" fill="#F59E0B">QUY TẮC TOÀN VẸN (CASE 2):</text>
  <text x="900" y="210" font-size="9.5" fill="#F8FAFC">&bull; Thẩm quyền: MOE HQ User</text>
  <text x="900" y="225" font-size="9.5" fill="#94A3B8">  Chỉ HQ mới được duyệt đóng</text>
  <text x="900" y="240" font-size="9.5" fill="#94A3B8">  và mở enrolment xuyên trường.</text>
  <text x="900" y="265" font-size="9.5" fill="#F8FAFC">&bull; Toàn vẹn Lịch sử học tập:</text>
  <text x="900" y="280" font-size="9.5" fill="#34D399">  Profile trường cũ lưu snapshot.</text>
  <text x="900" y="305" font-size="9.5" fill="#F8FAFC">&bull; Khoản Phí tại Trường Cũ:</text>
  <text x="900" y="325" font-size="9.5" fill="#FBBF24">  Khoản POSTED vẫn giữ nguyên,</text>
  <text x="900" y="340" font-size="9.5" fill="#FBBF24">  không bị gán sang trường mới.</text>
  <text x="900" y="365" font-size="9.5" fill="#F8FAFC">&bull; F08 EA Wallet: Tự động giữ</text>
  <text x="900" y="380" font-size="9.5" fill="#94A3B8">  nguyên liên kết theo NRIC.</text>
  <path d="M 745 210 L 745 350" stroke="#F59E0B" stroke-width="2" marker-end="url(#tr-amber)"/>
  <rect x="670" y="270" width="150" height="20" rx="4" fill="#0B101B" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="745" y="284" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="middle">MOE HQ Phê Duyệt Chuyển</text>
</svg>