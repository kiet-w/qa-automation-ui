<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e293b;
      padding: 24px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .postcard {
      position: relative;
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 52px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    /* Top decorative aerogramme stripe */
    .postcard::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: repeating-linear-gradient(
        45deg,
        #3b82f6,
        #3b82f6 14px,
        #ffffff 14px,
        #ffffff 22px,
        #ef4444 22px,
        #ef4444 36px,
        #ffffff 36px,
        #ffffff 44px
      );
    }

    /* Stamp container in top-right */
    .stamp-container {
      position: absolute;
      top: 36px;
      right: 44px;
      display: flex;
      align-items: center;
    }

    /* Postal Stamp */
    .stamp {
      width: 72px;
      height: 84px;
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 2px #ffffff;
      position: relative;
    }

    .stamp-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .stamp-check svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .stamp-text {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #64748b;
      text-transform: uppercase;
    }

    /* Cancellation Postmark */
    .postmark {
      position: absolute;
      top: -8px;
      right: 48px;
      width: 68px;
      height: 68px;
      border: 1.5px solid rgba(100, 116, 139, 0.4);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .postmark-text {
      font-size: 7px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(100, 116, 139, 0.65);
      text-transform: uppercase;
    }

    .postmark-date {
      font-size: 6.5px;
      font-weight: 600;
      color: rgba(100, 116, 139, 0.55);
      margin-top: 2px;
    }

    /* Content Area */
    .badge-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      font-size: 11px;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2563eb;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
      max-width: 420px;
    }

    .message {
      font-size: 17px;
      line-height: 1.65;
      color: #334155;
      margin-bottom: 28px;
      max-width: 520px;
    }

    .signature-block {
      border-top: 1px dashed #cbd5e1;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .signature-content {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
    }

    .signature-name {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-top: 4px;
    }

    .verification-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #10b981;
    }

    .verification-status svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #10b981;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="postcard">
    <div class="stamp-container">
      <div class="postmark">
        <span class="postmark-text">VERIFIED</span>
        <span class="postmark-date">QA • 2026</span>
      </div>
      <div class="stamp">
        <div class="stamp-check">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="stamp-text">PASSED</span>
      </div>
    </div>

    <div class="badge-wrap">
      <span class="badge-dot"></span>
      <span>AUTOMATION CONCLUSION</span>
    </div>

    <h1>Thank You So Much!</h1>

    <p class="message">
      My work has improved a lot thanks to your feedback. I really appreciate your comments and suggestions.
    </p>

    <div class="signature-block">
      <div class="signature-content">
        <span>With sincere gratitude,</span>
        <div class="signature-name">Kent Tran</div>
      </div>
      <div class="verification-status">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>All Tests Completed</span>
      </div>
    </div>
  </div>
</body>
</html>
