<svg viewBox="0 0 1180 680" width="100%" height="auto" class="select-none font-sans" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="seq-sky" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38BDF8"/>
    </marker>
    <marker id="seq-emerald" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#10B981"/>
    </marker>
    <marker id="seq-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#F59E0B"/>
    </marker>
    <marker id="seq-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#C084FC"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0B101B"/>
  <text x="35" y="40" font-size="15" font-weight="700" fill="#F8FAFC">SEQUENCE LIFECYCLE: FEE PUBLICATION &amp; DOWNSTREAM PARENT SETTLEMENT</text>
  <text x="35" y="60" font-size="11" fill="#94A3B8" font-family="monospace">From Draft Batch (F12) to Recipient Resolution (F14), POSTED Charges (F15), and Split Payment (R9)</text>
  <line x1="35" y1="72" x2="1145" y2="72" stroke="#334155" stroke-width="1"/>
  <rect x="35" y="85" width="170" height="50" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="120" y="105" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">School Admin</text>
  <text x="120" y="122" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle" font-family="monospace">SCHOOL USER</text>
  <line x1="120" y1="135" x2="120" y2="645" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <rect x="275" y="85" width="170" height="50" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="360" y="105" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">EduFAMS Core</text>
  <text x="360" y="122" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle" font-family="monospace">BATCH SERVICE</text>
  <line x1="360" y1="135" x2="360" y2="645" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <rect x="515" y="85" width="170" height="50" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="600" y="105" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">Database & Ledger</text>
  <text x="600" y="122" font-size="9" font-weight="600" fill="#F59E0B" text-anchor="middle" font-family="monospace">MSSQL / LEDGER</text>
  <line x1="600" y1="135" x2="600" y2="645" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <rect x="755" y="85" width="170" height="50" rx="8" fill="#1E293B" stroke="#C084FC" stroke-width="1.5"/>
  <text x="840" y="105" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">Parent Portal</text>
  <text x="840" y="122" font-size="9" font-weight="600" fill="#C084FC" text-anchor="middle" font-family="monospace">E-SERVICE :5174</text>
  <line x1="840" y1="135" x2="840" y2="645" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <rect x="975" y="85" width="170" height="50" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
  <text x="1060" y="105" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">Online Payment Gateway</text>
  <text x="1060" y="122" font-size="9" font-weight="600" fill="#EC4899" text-anchor="middle" font-family="monospace">EXTERNAL PGW</text>
  <line x1="1060" y1="135" x2="1060" y2="645" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>
  <line x1="120" y1="160" x2="360" y2="160" stroke="#10B981" stroke-width="1.6" marker-end="url(#seq-emerald)"/>
  <rect x="77.25" y="150" width="325.5" height="20" rx="4" fill="#0B101B" stroke="#10B981" stroke-width="0.8"/>
  <text x="240.0" y="164" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">1. Create Fee Batch (F12) & Target Config (F13)</text>
  <line x1="360" y1="205" x2="600" y2="205" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#seq-sky)"/>
  <rect x="271.75" y="195" width="416.5" height="20" rx="4" fill="#0B101B" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="480.0" y="209" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">2. Query Active Enrolment Profiles (F14 Recipient Resolution)</text>
  <line x1="600" y1="250" x2="360" y2="250" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#seq-amber)"/>
  <rect x="288.0" y="240" width="384.0" height="20" rx="4" fill="#0B101B" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="480.0" y="254" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="middle">3. Return Eligible Students (ID, Level, Class, SC/PR/IS)</text>
