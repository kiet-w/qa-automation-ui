  <rect x="428" y="286" width="380" height="18" rx="4" fill="#0B101B" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="435" y="299" font-size="10" font-weight="600" fill="#38BDF8">4. Calculate Net Amount = Rate Rule/Fixed + GST - FAS Subsidy</text>
  <line x1="360" y1="350" x2="600" y2="350" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#seq-sky)"/>
  <rect x="297.75" y="340" width="364.5" height="20" rx="4" fill="#0B101B" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="480.0" y="354" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">5. Persist Student Charges with Status = POSTED (F15)</text>
  <line x1="360" y1="395" x2="840" y2="395" stroke="#C084FC" stroke-width="1.6" marker-end="url(#seq-purple)"/>
  <rect x="404.75" y="385" width="390.5" height="20" rx="4" fill="#0B101B" stroke="#C084FC" stroke-width="0.8"/>
  <text x="600.0" y="399" font-size="10" font-weight="600" fill="#C084FC" text-anchor="middle">6. Notify & Synchronize to Parent Portal Outstanding Fees</text>
  <path d="M 840 425 L 900 425 L 900 455 L 840 455" fill="none" stroke="#C084FC" stroke-width="1.6" marker-end="url(#seq-purple)"/>
  <rect x="908" y="431" width="380" height="18" rx="4" fill="#0B101B" stroke="#C084FC" stroke-width="0.8"/>
  <text x="915" y="444" font-size="10" font-weight="600" fill="#C084FC">7. Parent logs in (Singpass Mock) & Selects Charges (SGD 100)</text>
  <line x1="840" y1="490" x2="360" y2="490" stroke="#10B981" stroke-width="1.6" marker-end="url(#seq-emerald)"/>
  <rect x="401.5" y="480" width="397.0" height="20" rx="4" fill="#0B101B" stroke="#10B981" stroke-width="0.8"/>
  <text x="600.0" y="494" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">8. Execute Split Payment: SGD 40 EA Wallet + SGD 60 Online</text>
  <line x1="360" y1="535" x2="1060" y2="535" stroke="#EC4899" stroke-width="1.6" marker-end="url(#seq-purple)"/>
  <rect x="518.0" y="525" width="384.0" height="20" rx="4" fill="#0B101B" stroke="#EC4899" stroke-width="0.8"/>
  <text x="710.0" y="539" font-size="10" font-weight="600" fill="#EC4899" text-anchor="middle">9. Redirect SGD 60 to Online Payment Gateway (Simulator)</text>
  <line x1="1060" y1="580" x2="360" y2="580" stroke="#10B981" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#seq-emerald)"/>
  <rect x="553.75" y="570" width="312.5" height="20" rx="4" fill="#0B101B" stroke="#10B981" stroke-width="0.8"/>
  <text x="710.0" y="584" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">10. Payment Gateway Webhook Callback: SUCCESS</text>
  <line x1="360" y1="625" x2="600" y2="625" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#seq-sky)"/>
  <rect x="278.25" y="615" width="403.5" height="20" rx="4" fill="#0B101B" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="480.0" y="629" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">11. Update Charge Status = SETTLED, Post GL & Issue Receipt</text>
</svg>