[pytest]
testpaths = tests
pythonpath = .
norecursedirs = .* build dist CVS _darcs {arch} *.egg _legacy_archive
# Test Execution Configuration:
# - Headless by default (browser runs silently in background)
# - Pass --headed CLI flag if visual browser debugging is needed
# - -n 3: Parallel test execution with 3 workers
# - --video=off: Video recording disabled for fast execution
# - --screenshot=only-on-failure: Capture screenshot automatically upon failure
# - Reports are routed automatically into the selected test folder under reports/
addopts = -v -n 3 --video=off --screenshot=only-on-failure --output=reports/test-results --json-report --json-report-file=reports/report.json --html=reports/report.html --self-contained-html
markers =
    search: search automation tests (Bing & YouTube)
    example: sample and demo test scenarios
    curricula: curricula trainer account validation test suite
    fs08: parent portal & singpass profile test suite (FS-08 / R8)
    fs09: outstanding fees & payment test suite (FS-09 / R9)
    break_it: adversarial, negative, chaos, client-bypass, and resilience testing (pha co ky luat)
    p0: priority 0 critical test cases
    p1: priority 1 high test cases
    p2: priority 2 medium test cases
    priority_high: high priority tests
    priority_medium: medium priority tests
    priority_low: low priority tests
    functional: functional test suite
    security: security, authorization, and data protection test suite
    regression: regression test suite
    ui: ui automation tests
    smoke: smoke test suite
    validation: validation and error handling test suite
    flow: end-to-end user journey and navigation flow test suite
    ac: acceptance criteria user story test suite
    atomic: atomic field and component level test suite
    integration: integration and end-to-end user journey test suite
    nfr: non-functional requirement UI health test suite
    br: core business rules and multi-tenancy test suite
    rbac: role-based access control and navigation matrix test suite
    techui: field-level technical and ui test suite
    tech_ui: field-level technical and ui matrix test suite
    error: error handling and resilience test suite
    resilience: network and system resilience test suite

