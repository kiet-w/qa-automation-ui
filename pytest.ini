[pytest]
testpaths = tests
pythonpath = .
# Cấu hình kiểm thử tự động:
# - --headed: Luôn mở cửa sổ trình duyệt lên màn hình
# - --video=on: Ghi video lại toàn bộ quá trình test (tự động làm mới mỗi lần chạy)
# - --screenshot=only-on-failure: Tự chụp ảnh khi có lỗi
# - --output=reports/test-results: Thư mục lưu trữ video và screenshot
addopts = -v --headed --video=on --screenshot=only-on-failure --output=reports/test-results --json-report --json-report-file=reports/report.json
markers =
    search: search automation tests
    example: sample and demo tests
