[pytest]
testpaths = tests
pythonpath = .
# Test Execution Configuration:
# - Headless by default (browser runs silently in background, logs stream to console)
# - Pass --headed CLI flag if visual browser debugging is needed
# - --video=on: Record high-resolution WebM video for all tests
# - --screenshot=only-on-failure: Capture screenshot automatically upon failure
# - --output=reports/test-results: Target folder for raw artifacts (videos and traces)
addopts = -v --video=on --screenshot=only-on-failure --output=reports/test-results --json-report --json-report-file=reports/report.json
markers =
    search: search automation tests (Bing & YouTube)
    example: sample and demo test scenarios
    curricula: curricula trainer account validation test suite
    fs08: parent portal & singpass profile test suite (FS-08 / R8)
    break_it: adversarial, negative, chaos, client-bypass, and resilience testing (pha co ky luat)
    p0: priority 0 critical test cases
    p1: priority 1 high test cases
    p2: priority 2 medium test cases
    priority_high: high priority tests
    priority_medium: medium priority tests
    priority_low: low priority tests
    functional: functional test suite
    security: security, authorization, and data protection test suite
    regression: regression test suite
    ui: ui automation tests
    smoke: smoke test suite

